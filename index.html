<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>نور الحلال | تعارف ودردشة جزائرية</title>
<meta name="description" content="نور الحلال — مساحة جزائرية للتعارف والدردشة باحترام، للبالغين 18 سنة فأكثر.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<main class="shell">
<section class="hero-banner" aria-label="نور الحلال للتعارف والزواج الحلال">
  <img src="Screenshot_2026-09-23-16-31-39-624_com.openai.chatgpt-edit.jpg" alt="نور الحلال — للتعارف و الزواج الحلال" loading="eager">
</section>

<section class="card auth" id="authView">
  <div class="logo">نور <span>الحلال</span></div>
  <p class="tag">مساحة جزائرية للتعارف باحترام وخصوصية</p>
  <a class="home-login" href="login.html">🔐 تسجيل الدخول</a>
  <div class="notice">🔞 هذا الموقع مخصص للبالغين من عمر 18 سنة فأكثر.</div>
  <div class="tabs">
    <button class="active" data-tab="register">إنشاء حساب</button>
    <button data-tab="login">تسجيل الدخول</button>
  </div>
  <form id="registerForm">
    <label>اسم المستخدم<input id="username" required minlength="3" maxlength="30" autocomplete="username"></label>
    <label>كلمة المرور<input id="password" type="password" required minlength="6" autocomplete="new-password"></label>
    <label>تأكيد كلمة المرور<input id="confirmPassword" type="password" required autocomplete="new-password"></label>
    <label>العمر<input id="age" type="number" min="18" max="100" required></label>
    <label>الولاية<select id="wilaya" required></select></label>
    <label>صورة البروفايل<input id="profilePhoto" type="file" accept="image/jpeg,image/png,image/webp" required><small class="help">الصورة مطلوبة لإكمال إنشاء الحساب.</small></label>
    <img id="profilePreview" class="profile-preview" alt="معاينة صورة البروفايل" hidden>
    <label class="check"><input type="checkbox" required> <span>أؤكد أن عمري 18 سنة أو أكثر وأوافق على احترام الآخرين.</span></label>
    <button class="primary" type="submit">إنشاء حساب</button>
  </form>
  <form id="loginForm" hidden>
    <label>اسم المستخدم<input id="loginUsername" required autocomplete="username"></label>
    <label>كلمة المرور<input id="loginPassword" type="password" required autocomplete="current-password"></label>
    <button class="primary" type="submit">دخول</button>
  </form>
  <p class="msg" id="authMsg"></p>
</section>

<section class="card chat" id="chatView" hidden>
<header class="chat-top"><div class="brand-mini"><div class="brand-dot">ن</div><div><strong>نور الحلال</strong><small id="me"></small></div></div><div class="top-actions"><button class="icon-btn" id="searchToggle">⌕</button><button class="ghost" id="logout">تسجيل الخروج</button></div></header>
<div class="chat-app"><aside class="chat-sidebar"><div class="sidebar-title"><h3>المحادثات</h3><button class="icon-btn" id="newChat">＋</button></div><div class="search-box" id="searchBox" hidden><input id="userSearch" placeholder="ابحث عن عضو..."></div><div class="online-title">متصلون الآن <span id="onlineCount">4</span></div><div id="users"></div></aside>
<section class="room"><div class="room-head"><div class="active-avatar">ن</div><div><strong id="roomName">القاعة العامة</strong><small id="roomStatus">تعارف باحترام • متصلون الآن</small></div><button class="icon-btn" id="roomMore">⋮</button></div><div class="messages" id="messages"></div><div class="typing" id="typing" hidden>يكتب الآن…</div><form class="send" id="messageForm"><button type="button" class="attach" id="emojiBtn">☺</button><input id="message" placeholder="اكتب رسالة محترمة..." maxlength="500" autocomplete="off"><button class="send-btn" type="submit">إرسال ➤</button></form><div class="quick-replies" id="quickReplies"><button type="button">السلام عليكم 👋</button><button type="button">كيف حالك؟</button><button type="button">من أي ولاية؟</button></div></section></div><div class="safety-bar">🔒 لا تشارك كلمة السر أو معلوماتك البنكية • 🚫 يمكنك الإبلاغ والحظر في أي وقت</div></section>
</main>
<script src="app.js"></script>
</body>
</html>
