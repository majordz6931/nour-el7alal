<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>موقع النور | دردشة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <div class="logo">ن</div>
  <h1>موقع النور</h1>
  <p>دردشة بسيطة ومحترمة للتواصل بين المستخدمين.</p>

  <div class="actions">
    <button onclick="openBox('login')">تسجيل الدخول</button>
    <button class="secondary" onclick="openBox('signup')">إنشاء حساب</button>
  </div>

  <section id="box" class="card hidden">
    <div class="tabs">
      <button id="lt" onclick="openBox('login')">دخول</button>
      <button id="st" onclick="openBox('signup')">حساب جديد</button>
    </div>

    <form id="login">
      <input name="username" placeholder="اسم المستخدم" autocomplete="username" required>
      <input name="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>
      <button>دخول</button>
    </form>

    <form id="signup" class="hidden">
      <label>اسم المستخدم</label>
      <input name="username" placeholder="اختر اسم المستخدم" minlength="3" maxlength="30" autocomplete="username" required>

      <label>كلمة المرور</label>
      <input name="password" type="password" placeholder="كلمة المرور" minlength="6" autocomplete="new-password" required>

      <label>تاريخ الميلاد</label>
      <input name="birthdate" type="date" required>

      <label>الولاية</label>
      <select name="wilaya" required>
        <option value="">اختر الولاية</option>
        <option>أدرار</option><option>الشلف</option><option>الأغواط</option><option>أم البواقي</option>
        <option>باتنة</option><option>بجاية</option><option>بسكرة</option><option>بشار</option>
        <option>البليدة</option><option>البويرة</option><option>تمنراست</option><option>تبسة</option>
        <option>تلمسان</option><option>تيارت</option><option>تيزي وزو</option><option>الجزائر</option>
        <option>الجلفة</option><option>جيجل</option><option>سطيف</option><option>سعيدة</option>
        <option>سكيكدة</option><option>سيدي بلعباس</option><option>عنابة</option><option>قالمة</option>
        <option>قسنطينة</option><option>المدية</option><option>مستغانم</option><option>المسيلة</option>
        <option>معسكر</option><option>ورقلة</option><option>وهران</option><option>البيض</option>
        <option>إليزي</option><option>برج بوعريريج</option><option>بومرداس</option><option>الطارف</option>
        <option>تندوف</option><option>تيسمسيلت</option><option>الوادي</option><option>خنشلة</option>
        <option>سوق أهراس</option><option>تيبازة</option><option>ميلة</option><option>عين الدفلى</option>
        <option>النعامة</option><option>عين تموشنت</option><option>غرداية</option><option>غليزان</option>
        <option>تيميمون</option><option>برج باجي مختار</option><option>أولاد جلال</option><option>بني عباس</option>
        <option>إن صالح</option><option>إن قزام</option><option>تقرت</option><option>جانت</option>
        <option>المغير</option><option>المنيعة</option>
      </select>

      <label>الجنس</label>
      <div class="gender">
        <label><input type="radio" name="gender" value="ذكر" required> ذكر</label>
        <label><input type="radio" name="gender" value="أنثى" required> أنثى</label>
      </div>

      <label>صورة البروفايل</label>
      <input id="profileImage" name="profileImage" type="file" accept="image/*">
      <div id="imagePreview" class="image-preview hidden"></div>

      <label>نبذة عنك</label>
      <textarea name="bio" maxlength="300" placeholder="اكتب نبذة قصيرة عن نفسك (اختياري)"></textarea>

      <button type="submit">إنشاء الحساب</button>
    </form>
    <small id="formMessage">سيتم ربط الحسابات والدردشة الحقيقية لاحقًا.</small>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
