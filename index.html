<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="موقع النور - تعارف جاد وشات محترم بنية الزواج في الجزائر"><title>موقع النور | تسجيل الدخول</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page">
<div class="auth-shell">
  <div class="auth-brand"><span class="brand-mark">ن</span><div><strong>موقع النور</strong><small>تعارف جاد وشات للزواج في الجزائر</small></div></div>
  <div class="auth-card">
    <div class="auth-tabs"><button class="auth-tab active" id="loginTab">تسجيل الدخول</button><button class="auth-tab" id="signupTab">إنشاء حساب</button></div>
    <section id="loginForm">
      <span class="eyebrow">مرحبًا بعودتك</span><h1>سجّل الدخول</h1><p>ادخل إلى حسابك لمشاهدة الأشخاص والتواصل معهم.</p>
      <label>اسم المستخدم<input id="loginUsername" type="text" placeholder="اسم المستخدم" autocomplete="username"></label>
      <label>كلمة المرور<input id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password"></label>
      <button class="btn btn-primary full" id="loginSubmit">تسجيل الدخول</button>
    </section>
    <section id="signupForm" class="hidden-form">
      <span class="eyebrow">انضم إلى موقع النور</span><h1>إنشاء حساب</h1><p>أنشئ حسابًا مجانيًا وابدأ التعارف بشكل محترم.</p>
      <label>اسم المستخدم<input id="signupUsername" type="text" placeholder="مثال: mohamed31" autocomplete="username"></label>
      <label>كلمة المرور<input id="signupPassword" type="password" placeholder="6 أحرف على الأقل" autocomplete="new-password"></label>
      <label>تاريخ الميلاد<input id="signupDob" type="date"></label>
      <label>الولاية<select id="signupWilaya"><option value="">اختر الولاية</option><option>الجزائر</option><option>البليدة</option><option>وهران</option><option>قسنطينة</option><option>سطيف</option><option>تيزي وزو</option><option>بجاية</option><option>بومرداس</option><option>عنابة</option><option>باتنة</option><option>المسيلة</option><option>البويرة</option></select></label>
      <div class="two-fields"><label>الجنس<select id="signupGender"><option value="">اختر</option><option value="male">رجل</option><option value="female">امرأة</option></select></label><label>أبحث عن<select id="signupSeeking"><option value="">اختر</option><option value="male">رجل</option><option value="female">امرأة</option></select></label></div>
      <button class="btn btn-primary full" id="signupSubmit">إنشاء الحساب</button>
    </section>
    <div class="auth-message" id="authMessage"></div>
    
  </div>
  <p class="auth-note">🔒 التسجيل مطلوب للوصول إلى الملفات الشخصية والشات والإعجاب وإضافة الأصدقاء.</p>
</div>
<script src="app.js"></script></body></html>
