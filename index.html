<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نور الحلال</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🌙 نور الحلال</div>
  <button id="logoutBtn" class="ghost hidden">خروج</button>
</header>
<main>
<section id="authView" class="card auth">
  <h1>نور الحلال</h1>
  <p class="muted">تعارف جاد باحترام وخصوصية</p>
  <div class="tabs">
    <button class="tab active" data-tab="login">دخول</button>
    <button class="tab" data-tab="signup">حساب جديد</button>
  </div>
  <form id="authForm">
    <input id="username" placeholder="اسم المستخدم" minlength="3" maxlength="24" autocomplete="username" required>
    <input id="password" type="password" placeholder="كلمة المرور" minlength="6" autocomplete="current-password" required>
    <div id="signupFields" class="hidden">
      <label class="field-label">تاريخ الميلاد</label>
      <input id="dateOfBirth" type="date" required>
      <label class="field-label">الولاية</label>
      <select id="wilaya" required></select>
      <label class="field-label">الجنس</label>
      <select id="gender" required>
        <option value="">اختر الجنس</option>
        <option value="male">ذكر</option>
        <option value="female">أنثى</option>
      </select>
      <label class="field-label">أبحث عن</label>
      <select id="seeking" required>
        <option value="">أبحث عن...</option>
        <option value="male">رجل</option>
        <option value="female">امرأة</option>
      </select>
      <label class="field-label">صورة البروفيل</label>
      <input id="avatar" type="file" accept="image/jpeg,image/png,image/webp">
      <img id="avatarPreview" class="avatar-preview hidden" alt="معاينة الصورة">
    </div>
    <button class="primary" type="submit" id="authSubmit">تسجيل الدخول</button>
  </form>
  <p id="authMsg" class="msg"></p>
</section>

<section id="appView" class="hidden">
  <div class="grid">
    <div class="card">
      <h2>ملفي الشخصي</h2>
      <form id="profileForm">
        <div class="profile-photo-wrap"><img id="profileAvatarPreview" class="profile-photo hidden" alt="صورة البروفيل"></div>
        <input id="pUsername" placeholder="اسم المستخدم" readonly>
        <label class="field-label">تاريخ الميلاد</label>
        <input id="pDateOfBirth" type="date" required>
        <label class="field-label">الولاية</label>
        <select id="pWilaya" required></select>
        <label class="field-label">الجنس</label>
        <select id="pGender" required>
          <option value="male">ذكر</option>
          <option value="female">أنثى</option>
        </select>
        <label class="field-label">أبحث عن</label>
        <select id="pSeeking" required>
          <option value="male">رجل</option>
          <option value="female">امرأة</option>
        </select>
        <label class="field-label">تغيير صورة البروفيل</label>
        <input id="pAvatar" type="file" accept="image/jpeg,image/png,image/webp">
        <button class="primary">حفظ الملف</button>
      </form>
      <p id="profileMsg" class="msg"></p>
    </div>
    <div class="card">
      <h2>المستخدمون</h2>
      <input id="search" placeholder="ابحث باسم المستخدم أو الولاية">
      <div id="users" class="users"></div>
    </div>
  </div>
  <div class="card chat">
    <div class="chat-head"><h2 id="chatTitle">المحادثة</h2><div id="safetyActions" class="safety-actions hidden"><button id="blockBtn" class="danger-outline" type="button">🚫 حظر</button><button id="reportBtn" class="warn-outline" type="button">⚠️ تبليغ</button></div></div>
    <div id="messages" class="messages"></div>
    <form id="messageForm">
      <input id="messageInput" placeholder="اكتب رسالة..." maxlength="5000" required>
      <button class="primary">إرسال</button>
    </form>
  </div>
</section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
