<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نور الحلال</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🌙 نور الحلال</div>
  <button id="logoutBtn" class="ghost hidden" type="button">خروج</button>
</header>

<main>
<section id="authView" class="card auth">
  <h1>نور الحلال</h1>
  <p class="muted">تعارف جاد باحترام وخصوصية</p>
  <div class="tabs">
    <button class="tab active" data-tab="login" type="button">دخول</button>
    <button class="tab" data-tab="signup" type="button">حساب جديد</button>
  </div>
  <form id="authForm">
    <input id="username" placeholder="اسم المستخدم" minlength="3" maxlength="24" autocomplete="username" required>
    <input id="password" type="password" placeholder="كلمة المرور" minlength="6" autocomplete="current-password" required>
    <div id="signupFields" class="hidden">
      <label class="field-label">تاريخ الميلاد</label>
      <input id="dateOfBirth" type="date" required>
      <label class="field-label">الولاية</label>
      <select id="wilaya" required></select>
      <label class="field-label">الجنس</label>
      <select id="gender" required>
        <option value="">اختر الجنس</option>
        <option value="male">ذكر</option>
        <option value="female">أنثى</option>
      </select>
      <label class="field-label">أبحث عن</label>
      <select id="seeking" required>
        <option value="">أبحث عن...</option>
        <option value="male">رجل</option>
        <option value="female">امرأة</option>
      </select>
      <label class="field-label">صورة البروفيل</label>
      <input id="avatar" type="file" accept="image/jpeg,image/png,image/webp">
      <img id="avatarPreview" class="avatar-preview hidden" alt="معاينة الصورة">
    </div>
    <button class="primary" type="submit" id="authSubmit">تسجيل الدخول</button>
  </form>
  <p id="authMsg" class="msg"></p>
</section>

<section id="appView" class="hidden chat-app">
  <div class="chat-layout">
    <aside class="online-panel card">
      <div class="online-head">
        <div>
          <h2>الأشخاص المتصلون</h2>
          <span id="onlineCount" class="online-count">0 متصل</span>
        </div>
        <span class="live-dot" title="متصل"></span>
      </div>
      <div id="onlineUsers" class="online-users">
        <p class="muted empty-online">جاري تحميل المتصلين...</p>
      </div>
    </aside>

    <section class="chat card">
      <div class="chat-head">
        <div class="chat-person">
          <div id="chatAvatar" class="chat-avatar placeholder">👤</div>
          <div>
            <h2 id="chatTitle">اختر شخصًا</h2>
            <p id="chatStatus" class="muted">اختر شخصًا من المتصلين لبدء الدردشة</p>
          </div>
        </div>
        <div id="safetyActions" class="safety-actions hidden">
          <button id="blockBtn" class="danger-outline" type="button">🚫 حظر</button>
          <button id="reportBtn" class="warn-outline" type="button">⚠️ تبليغ</button>
        </div>
      </div>

      <div id="messages" class="messages">
        <div class="empty-chat">
          <div class="empty-icon">💬</div>
          <h3>ابدأ محادثة</h3>
          <p class="muted">اختر شخصًا متصلًا من القائمة</p>
        </div>
      </div>

      <form id="messageForm" class="message-form">
        <input id="messageInput" placeholder="اكتب رسالة..." maxlength="5000" autocomplete="off" disabled>
        <button class="primary" type="submit" disabled id="sendBtn">إرسال</button>
      </form>
    </section>
  </div>
</section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
