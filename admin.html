<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نور الحلال - لوحة التحكم</title>
<link rel="stylesheet" href="style.css">
<style>
body{margin:0;background:#07131c;color:#e8f1f5;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
.admin-page{max-width:1200px;margin:0 auto;padding:18px}
.admin-top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#111d23;border:1px solid #293940;border-radius:16px;padding:14px 18px;margin-bottom:14px}
.admin-top h1{margin:0;font-size:22px}.admin-top small{display:block;color:#91a5af;margin-top:4px}
.admin-nav{display:flex;gap:8px;flex-wrap:wrap}.admin-nav button{border:1px solid #334650;background:#17252d;color:#e8f1f5;border-radius:10px;padding:9px 13px;cursor:pointer}
.admin-nav button:hover{background:#20333d}
.admin-stats{margin-bottom:14px}
.admin-users{max-height:520px}
.admin-user-main{display:flex;align-items:center;gap:10px}.admin-avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;background:#173b31;display:grid;place-items:center;color:#8df0ba;font-weight:800}.admin-avatar img{width:100%;height:100%;object-fit:cover}
.admin-user-main small{display:block;color:#91a5af;margin-top:3px}
.admin-edit input,.admin-edit select,.admin-edit textarea,.admin-conversation select{width:100%;box-sizing:border-box;margin:5px 0;padding:10px;border-radius:9px;border:1px solid #344650;background:#0d181e;color:#e8f1f5}
.admin-form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.admin-msg{padding:9px;border-bottom:1px solid #26343b}.admin-msg time{float:left;color:#81939d;font-size:11px}.admin-msg p{margin:7px 0;white-space:pre-wrap;word-break:break-word}
.admin-conversation{margin-top:12px}.admin-chat-head{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.admin-empty{padding:30px;text-align:center;color:#91a5af}
@media(max-width:700px){.admin-page{padding:10px}.admin-form-grid,.admin-chat-head{grid-template-columns:1fr}.admin-user{align-items:flex-start;flex-direction:column}.admin-actions{width:100%;justify-content:flex-start}}
</style>
</head>
<body>
<main class="admin-page">
<header class="admin-top">
<div><h1>🛡️ لوحة تحكم نور الحلال</h1><small>إدارة الأعضاء والمحادثات والحسابات</small></div>
<div class="admin-nav"><button id="refresh">↻ تحديث</button><button id="showReports">⚠️ البلاغات</button><button id="showBlocks">🚫 الحظر</button><button id="backSite">← الموقع</button><button id="logoutAdmin">تسجيل الخروج</button></div>
</header>
<section id="adminRoot"><div class="admin-empty">جاري التحقق من صلاحيات الإدارة...</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fiqqkexapeivhvoigomv.supabase.co";
const SUPABASE_KEY="sb_publishable__K-3VfJgl21taaQVfgiXNA_o0AdTHU7";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(action,extra={}){const {data,error}=await supabaseClient.functions.invoke("admin-control",{body:{action,...extra}});if(error)throw error;if(data?.error)throw new Error(data.error);return data}
async function load(){
 const root=$("#adminRoot"); root.innerHTML='<div class="admin-empty">جاري تحميل البيانات...</div>';
 try{
  const me=await api("me"); if(!me?.is_admin){location.href="index.html";return}
  const d=await api("dashboard"); const users=d.users||[];
  root.innerHTML='<div id="stats" class="admin-stats"></div><div class="admin-toolbar"><input id="search" placeholder="ابحث باسم المستخدم أو الولاية..."></div><div id="users" class="admin-users"></div><div id="conversation" class="admin-conversation"></div>';
  $("#stats").innerHTML='<div><b>'+d.stats.users+'</b><span>الأعضاء</span></div><div><b>'+d.stats.online+'</b><span>متصل الآن</span></div><div><b>'+d.stats.messages+'</b><span>الرسائل</span></div><div><b>'+d.stats.reports+'</b><span>البلاغات المفتوحة</span></div>';
  const render=()=>{const q=($("#search").value||"").trim().toLowerCase();const list=users.filter(u=>(u.username||"").toLowerCase().includes(q)||(u.wilaya||"").toLowerCase().includes(q));$("#users").innerHTML=list.map(u=>'<article class="admin-user"><div class="admin-user-main"><div class="admin-avatar">'+(u.avatar_url?'<img src="'+esc(u.avatar_url)+'" alt="">':esc((u.username||"ن")[0]))+'</div><div><b>'+esc(u.username)+'</b><small>'+esc((u.age||"")+" سنة • "+(u.wilaya||"الجزائر"))+'</small><small>'+(u.is_online?"🟢 متصل":"⚪ غير متصل")+(u.verified?" • ✓ موثق":"")+'</small></div></div><div class="admin-actions"><button class="mini-action edit" data-id="'+u.id+'">✏️ تعديل</button><button class="mini-action msgs" data-id="'+u.id+'">💬 الرسائل</button><button class="mini-action danger del" data-id="'+u.id+'">🗑️ حذف</button></div></article>').join("")||'<div class="admin-empty">لا توجد نتائج.</div>';
  document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>edit(users.find(u=>u.id===b.dataset.id)));
  document.querySelectorAll(".msgs").forEach(b=>b.onclick=()=>conversation(users.find(u=>u.id===b.dataset.id),users));
  document.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{if(!confirm("حذف الحساب نهائيًا؟"))return;try{await api("delete_user",{user_id:b.dataset.id});load()}catch(e){alert(e.message)}})};
  $("#search").oninput=render;render();
 }catch(e){root.innerHTML='<div class="admin-empty">تعذر فتح لوحة التحكم: '+esc(e.message)+'</div>'}
}
async function showReports(){try{const [rd,ud]=await Promise.all([api("reports"),api("users")]);const users=ud.users||[],reports=rd.reports||[];$("#conversation").innerHTML='<div class="admin-edit"><h3>⚠️ البلاغات</h3><div id="reportsList"></div></div>';$("#reportsList").innerHTML=reports.map(r=>{const reporter=users.find(u=>u.id===r.reporter_id)?.username||r.reporter_id.slice(0,8);const reported=users.find(u=>u.id===r.reported_id)?.username||r.reported_id.slice(0,8);return '<article class="admin-msg"><b>'+esc(reporter)+' → '+esc(reported)+'</b><time>'+new Date(r.created_at).toLocaleString("ar-DZ")+'</time><p><strong>'+esc(r.reason)+'</strong><br>'+esc(r.details||"لا توجد تفاصيل")+'</p><select class="report-status" data-id="'+r.id+'"><option value="open" '+(r.status==="open"?"selected":"")+'>مفتوح</option><option value="reviewed" '+(r.status==="reviewed"?"selected":"")+'>قيد المراجعة</option><option value="closed" '+(r.status==="closed"?"selected":"")+'>مغلق</option></select> <button class="mini-action danger report-block" data-user="'+r.reporter_id+'" data-target="'+r.reported_id+'">🚫 حظر المُبلّغ عنه</button></article>'}).join("")||'<div class="admin-empty">لا توجد بلاغات.</div>';document.querySelectorAll(".report-status").forEach(s=>s.onchange=async()=>{try{await api("update_report",{report_id:s.dataset.id,status:s.value})}catch(e){alert(e.message)}});document.querySelectorAll(".report-block").forEach(b=>b.onclick=async()=>{if(!confirm("حظر هذا العضو من طرف المُبلّغ؟"))return;try{await api("admin_block",{user_id:b.dataset.user,blocked_id:b.dataset.target});alert("تم الحظر");}catch(e){alert(e.message)}})}catch(e){alert(e.message)}}
async function showBlocks(){try{const [bd,ud]=await Promise.all([api("admin_blocks"),api("users")]);const users=ud.users||[],blocks=bd.blocks||[];$("#conversation").innerHTML='<div class="admin-edit"><h3>🚫 الحظر</h3><div id="blocksList"></div></div>';$("#blocksList").innerHTML=blocks.map(b=>{const a=users.find(u=>u.id===b.user_id)?.username||b.user_id.slice(0,8);const x=users.find(u=>u.id===b.blocked_id)?.username||b.blocked_id.slice(0,8);return '<article class="admin-msg"><b>'+esc(a)+' ← حظر → '+esc(x)+'</b><time>'+new Date(b.created_at).toLocaleString("ar-DZ")+'</time><p><button class="mini-action unblock-admin" data-user="'+b.user_id+'" data-target="'+b.blocked_id+'">🔓 فك الحظر</button></p></article>'}).join("")||'<div class="admin-empty">لا توجد حالات حظر.</div>';document.querySelectorAll(".unblock-admin").forEach(b=>b.onclick=async()=>{try{await api("admin_unblock",{user_id:b.dataset.user,blocked_id:b.dataset.target});showBlocks()}catch(e){alert(e.message)}})}catch(e){alert(e.message)}}
function edit(u){$("#conversation").innerHTML='<div class="admin-edit"><h3>تعديل حساب: '+esc(u.username)+'</h3><div class="admin-form-grid"><input id="uName" value="'+esc(u.username)+'" placeholder="اسم المستخدم"><input id="uAge" type="number" min="18" max="100" value="'+esc(u.age||"")+'" placeholder="العمر"><input id="uWilaya" value="'+esc(u.wilaya||"")+'" placeholder="الولاية"><input id="uJob" value="'+esc(u.profession||"")+'" placeholder="المهنة"><select id="uVerified"><option value="false">غير موثق</option><option value="true" '+(u.verified?"selected":"")+'>موثق</option></select></div><textarea id="uBio" placeholder="النبذة">'+esc(u.bio||"")+'</textarea><button class="primary" id="save">حفظ</button> <button class="mini-action" id="cancel">إلغاء</button></div>';
$("#cancel").onclick=()=>$("#conversation").innerHTML="";$("#save").onclick=async()=>{try{await api("update_user",{user_id:u.id,username:$("#uName").value.trim(),age:Number($("#uAge").value)||null,wilaya:$("#uWilaya").value.trim(),profession:$("#uJob").value.trim(),bio:$("#uBio").value,verified:$("#uVerified").value==="true"});alert("تم الحفظ");load()}catch(e){alert(e.message)}}}
async function conversation(u,all){const others=all.filter(x=>x.id!==u.id);$("#conversation").innerHTML='<div class="admin-chat-head"><h3>محادثات '+esc(u.username)+'</h3><select id="other"><option value="">اختر العضو الآخر</option>'+others.map(x=>'<option value="'+x.id+'">'+esc(x.username)+'</option>').join("")+'</select><button class="mini-action danger" id="clear">مسح المحادثة</button></div><div id="msgs" class="admin-msgs">اختر عضوًا لعرض المحادثة.</div>';
$("#other").onchange=async()=>{const other=$("#other").value;if(!other)return;try{const d=await api("messages",{user_a:u.id,user_b:other});$("#msgs").innerHTML=(d.messages||[]).map(m=>'<div class="admin-msg"><div><b>'+esc((all.find(x=>x.id===m.sender_id)?.username)||"عضو")+'</b><time>'+new Date(m.created_at).toLocaleString("ar-DZ")+'</time></div><p>'+esc(m.body)+'</p><button class="danger mini-action dm" data-id="'+m.id+'">حذف</button></div>').join("")||"لا توجد رسائل.";document.querySelectorAll(".dm").forEach(b=>b.onclick=async()=>{await api("delete_message",{message_id:b.dataset.id});$("#other").dispatchEvent(new Event("change"))})}catch(e){alert(e.message)}};
$("#clear").onclick=async()=>{const other=$("#other").value;if(!other)return alert("اختر العضو الآخر.");if(confirm("مسح كامل المحادثة؟")){await api("clear_conversation",{user_a:u.id,user_b:other});$("#other").dispatchEvent(new Event("change"))}}
}
$("#refresh").onclick=load;$("#showReports").onclick=showReports;$("#showBlocks").onclick=showBlocks;$("#backSite").onclick=()=>location.href="index.html";$("#logoutAdmin").onclick=async()=>{await supabaseClient.auth.signOut();location.href="index.html"};load();
</script>
</body>
</html>
