<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>تسجيل الدخول | نور الحلال</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<main class="shell">
<section class="card auth">
  <div class="logo">نور <span>الحلال</span></div>
  <p class="tag">مرحباً بك من جديد 🌿</p>
  <div class="notice">🔞 الموقع مخصص للبالغين من عمر 18 سنة فأكثر.</div>

  <form id="loginPageForm">
    <label>اسم المستخدم
      <input id="loginUsername" type="text" required autocomplete="username" placeholder="أدخل اسم المستخدم">
    </label>
    <label>كلمة المرور
      <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="أدخل كلمة المرور">
    </label>
    <button class="primary" type="submit">تسجيل الدخول</button>
  </form>

  <p class="msg" id="loginMsg"></p>

  <p style="text-align:center;color:#9fb0c4">
    ليس لديك حساب؟
    <a href="index.html" style="color:#63d39b">إنشاء حساب جديد</a>
  </p>
</section>
</main>

<script>
document.getElementById("loginPageForm").addEventListener("submit", function(e){
  e.preventDefault();
  const username=document.getElementById("loginUsername").value.trim();
  const password=document.getElementById("loginPassword").value;
  if(!username || !password) return;
  const saved=localStorage.getItem("nourUser");
  if(saved){
    const user=JSON.parse(saved);
    if(user.username===username){
      localStorage.setItem("nourUser",JSON.stringify(user));
      window.location.href="index.html";
      return;
    }
  }
  document.getElementById("loginMsg").textContent="بيانات الدخول غير صحيحة أو الحساب غير موجود.";
});
</script>
</body>
</html>
